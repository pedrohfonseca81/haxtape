<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAXTAPE</title>
  <link rel="stylesheet" href="style.css?v=nocache_5">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Pako (Descompressão Deflate rápida) -->
  <script src="src/vendor/pako.min.js"></script>
  <!-- Núcleo Determinístico Oficial do HaxBall -->
  <script src="src/haxball-core.js?v=nocache_5"></script>
</head>
<body>
  <!-- Input de arquivo invisível mas acessível para todos os labels -->
  <input type="file" id="file-input" accept=".hbr2" style="position: fixed; top: -1000px; left: -1000px; opacity: 0;">

  <div class="app-container">
    <!-- Header Minimalista -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-ball">⚽</span>
        <h1 class="logo-title">HAX<span>TAPE</span></h1>
      </div>

      <div class="header-actions">
        <!-- Seletor de Partidas (Multi-partidas) -->
        <div id="match-selector-container" class="match-selector-wrapper" style="display: none;">
          <label for="match-select">Partida:</label>
          <select id="match-select" class="custom-select"></select>
        </div>

        <label for="file-input" class="btn btn-primary btn-sm">
          Abrir .hbr2
        </label>
      </div>
    </header>

    <!-- Área Principal do Player -->
    <main class="player-main">
      <div class="player-wrapper" id="player-wrapper">
        <!-- Canvas do Jogo -->
        <canvas id="game-canvas" width="1280" height="720"></canvas>

        <!-- Dropzone de Upload (Visível quando nenhum replay está carregado) -->
        <div id="dropzone" class="dropzone-overlay">
          <div class="dropzone-box" id="dropzone-clickable">
            <div class="dropzone-icon">📼</div>
            <h2>Arraste seu replay do HaxBall aqui</h2>
            <p>ou clique para selecionar um arquivo <code>.hbr2</code></p>
            <div class="dropzone-actions">
              <label for="file-input" id="btn-browse-file" class="btn btn-primary">
                Escolher Arquivo
              </label>
            </div>
          </div>
        </div>

        <!-- Indicador de Play/Pause central -->
        <div id="play-indicator" class="play-indicator"></div>
      </div>

      <!-- Barra de Controle e Linha do Tempo de Corte -->
      <section class="controls-panel" id="controls-panel" style="display: none;">
        <!-- Timeline com Alças de Corte e Marcadores de Gol -->
        <div class="timeline-container">
          <div class="timeline-header">
            <span class="trim-indicator">
              <span class="trim-chip">✂ Clipe</span>
              <strong id="trim-duration-text">00:00 → 00:00</strong>
              <span class="trim-length" id="trim-length-text">0.0s</span>
            </span>
            <!-- Marcar início/fim do corte na posição atual -->
            <div class="trim-actions">
              <button id="btn-set-in" class="btn-ghost" title="Marcar início do corte na posição atual">
                <kbd>I</kbd> Marcar início
              </button>
              <button id="btn-set-out" class="btn-ghost" title="Marcar fim do corte na posição atual">
                <kbd>O</kbd> Marcar fim
              </button>
            </div>
          </div>

          <div class="timeline-bar" id="timeline-bar">
            <!-- Faixa do Replay Total (partidas destacadas) -->
            <div class="timeline-track" id="timeline-track"></div>
            <!-- Áreas fora do corte (escurecidas) -->
            <div class="timeline-dim dim-left" id="timeline-dim-left"></div>
            <div class="timeline-dim dim-right" id="timeline-dim-right"></div>
            <!-- Faixa Selecionada para Corte -->
            <div class="timeline-range" id="timeline-range">
              <span class="range-label" id="timeline-range-label"></span>
            </div>
            <!-- Marcadores de Gol na Timeline -->
            <div class="timeline-markers" id="timeline-markers"></div>
            <!-- Prévia do tempo sob o mouse -->
            <div class="timeline-hover" id="timeline-hover">
              <span class="hover-time" id="timeline-hover-time">00:00</span>
            </div>
            <!-- Agulha de Reprodução Atual (Playhead) -->
            <div class="timeline-playhead" id="timeline-playhead"></div>
            <!-- Alça de Início do Corte -->
            <div class="trim-handle handle-start" id="handle-start" title="Início do corte — arraste ou pressione I">
              <span class="handle-grip"></span>
              <span class="handle-tag" id="handle-start-tag">00:00</span>
            </div>
            <!-- Alça de Fim do Corte -->
            <div class="trim-handle handle-end" id="handle-end" title="Fim do corte — arraste ou pressione O">
              <span class="handle-grip"></span>
              <span class="handle-tag" id="handle-end-tag">00:00</span>
            </div>
          </div>
          <!-- Régua de tempo -->
          <div class="timeline-ruler" id="timeline-ruler"></div>
        </div>

        <!-- Controles Inferiores -->
        <div class="controls-toolbar">
          <div class="controls-left">
            <!-- Play / Pause -->
            <button id="btn-play-pause" class="btn btn-icon" title="Reproduzir / Pausar (Espaço)">
              <span id="play-icon">▶</span>
            </button>

            <!-- Tempo Atual / Duração -->
            <div class="time-display">
              <span id="current-time">00:00</span> / <span id="total-time">00:00</span>
            </div>

            <!-- Velocidade de Reprodução (clique alterna 0.5x → 1x → 2x) -->
            <button id="btn-speed" class="btn-chip" title="Velocidade de reprodução">1x</button>
          </div>

          <!-- Placar da Partida no Painel -->
          <div class="panel-scoreboard" id="panel-scoreboard" title="Placar da Partida">
            <div class="scoreboard-team red">
              <span class="scoreboard-score" id="panel-score-red">0</span>
              <span class="scoreboard-name" id="panel-name-red">RED</span>
            </div>
            <div class="scoreboard-time" id="panel-match-time">00:00</div>
            <div class="scoreboard-team blue">
              <span class="scoreboard-name" id="panel-name-blue">BLUE</span>
              <span class="scoreboard-score" id="panel-score-blue">0</span>
            </div>
          </div>

          <div class="controls-right">
            <!-- Súmula da Partida -->
            <button id="btn-summary" class="btn btn-icon" title="Súmula da partida (S)">📋</button>

            <!-- Toggle de Efeitos Sonoros -->
            <button id="btn-toggle-audio" class="btn btn-icon" title="Ativar/Desativar som do jogo">
              <span id="audio-icon">🔊</span>
            </button>

            <!-- Exportação: botão principal + formato acoplado -->
            <div class="export-group">
              <button id="btn-export-mp4" class="btn btn-export" title="Baixar o trecho selecionado (Shift+clique força MediaRecorder)">
                ⬇ Baixar clipe
              </button>
              <select id="export-format-select" class="export-format" title="Formato do vídeo">
                <option value="mp4" selected>MP4</option>
                <option value="webm">WebM</option>
              </select>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Súmula da Partida -->
    <div id="summary-modal" class="modal-overlay" style="display: none;">
      <div class="summary-card" role="dialog" aria-labelledby="summary-title">
        <header class="summary-head">
          <div>
            <h3 id="summary-title">Súmula da Partida</h3>
            <p class="summary-meta" id="summary-meta"></p>
          </div>
          <button id="btn-summary-close" class="btn btn-icon summary-close" title="Fechar (Esc)">✕</button>
        </header>

        <div class="summary-score" id="summary-score"></div>
        <p class="summary-result" id="summary-result"></p>

        <div class="summary-grid">
          <section class="summary-section">
            <h4>Gols</h4>
            <ol class="summary-goals" id="summary-goals"></ol>
          </section>
          <section class="summary-section">
            <h4>Estatísticas</h4>
            <div class="summary-stats" id="summary-stats"></div>
          </section>
        </div>

        <section class="summary-section">
          <h4>Escalações</h4>
          <div class="summary-lineups" id="summary-lineups"></div>
        </section>

        <div class="summary-mvp" id="summary-mvp"></div>

        <footer class="summary-actions">
          <button id="btn-summary-copy" class="btn btn-secondary btn-sm">📋 Copiar súmula</button>
          <button id="btn-summary-replay" class="btn btn-secondary btn-sm">↺ Rever partida</button>
          <button id="btn-summary-ok" class="btn btn-primary btn-sm">Fechar</button>
        </footer>
      </div>
    </div>

    <!-- Modal de Progresso da Exportação -->
    <div id="export-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3 id="export-modal-title">Exportando Clipe</h3>
        <p id="export-status-text">Processando quadros a 60 FPS...</p>
        
        <div class="progress-bar-container">
          <div id="export-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <span id="export-progress-pct" class="progress-pct-text">0%</span>

        <div class="modal-actions">
          <button id="btn-cancel-export" class="btn btn-secondary btn-sm">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Principal da Aplicação -->
  <script type="module" src="src/app.js?v=nocache_5"></script>
</body>
</html>
